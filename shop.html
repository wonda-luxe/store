<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Wonda Luxe</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">Wonda <span>Luxe</span></a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="cart-btn" onclick="openCart()">
        🛒 Cart <span class="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="container">
    <h2 class="section-title">All Products</h2>
    <div style="text-align:center; margin-bottom:2rem;">
      <button onclick="filterProducts('all')" class="filter-btn active" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">All</button>
      <button onclick="filterProducts('Face')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Face</button>
      <button onclick="filterProducts('Lips')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Lips</button>
      <button onclick="filterProducts('Eyes')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Eyes</button>
      <button onclick="filterProducts('Fragrance')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Fragrance</button>
      <button onclick="filterProducts('Body Care')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Body Care</button>
      <button onclick="filterProducts('Accessories')" class="filter-btn" style="margin:0 0.5rem; padding:0.5rem 1rem; border:1px solid #ddd; background:#fff; border-radius:20px; cursor:pointer;">Accessories</button>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </section>

  <footer>
    <p>&copy; 2026 Wonda Luxe. All rights reserved.</p>
    <p>WhatsApp: 08064674290</p>
  </footer>

  <a href="https://wa.me/2348064674290" class="whatsapp-float" target="_blank" title="Chat on WhatsApp">💬</a>

  <!-- Product Modal -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <img id="modal-image" src="" alt="">
      <h2 id="modal-name"></h2>
      <p class="price" id="modal-price"></p>
      <p id="modal-description" style="margin:1rem 0;"></p>
      <h4>Ingredients</h4>
      <div class="ingredients" id="modal-ingredients"></div>
      <button class="btn-primary" id="modal-add-btn" style="margin-top:1.5rem; width:100%;">Add to Cart</button>
    </div>
  </div>

  <!-- Cart Sidebar -->
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button onclick="closeCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total">₦0</span>
      </div>
      <button class="whatsapp-checkout" onclick="checkoutWhatsApp()">
        💬 Checkout via WhatsApp
      </button>
    </div>
  </div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function renderProducts(filter = 'all') {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
      
      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" onclick="showProductModal('${p.id}')">
          <div class="product-info">
            <h3 onclick="showProductModal('${p.id}')">${p.name}</h3>
            <div style="color:#999; font-size:0.85rem; margin-bottom:0.3rem;">${p.category}</div>
            <div class="price">${formatPrice(p.price)}</div>
            <button class="add-to-cart" onclick="addToCart('${p.id}')">Add to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts(cat);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
    });
  </script>
  <style>
    .filter-btn.active {
      background: var(--accent) !important;
      color: white;
      border-color: var(--accent) !important;
    }
  </style>
</body>
</html>
